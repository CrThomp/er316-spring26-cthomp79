
name: CI quality checks

on:
  workflow_dispatch:
  push:
    branches:
      - StaticAnalysis
      - Dev
  pull_request:
    branches:
      - StaticAnalysis
      - Dev

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile and assemble
        run: ./gradlew assemble

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Add checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Make Gradle permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          if-no-files-found: warn

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Add checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Make Gradle permission
        run: chmod +x gradlew

      - name: Run Checkstyle
        run: ./gradlew checkstyleMain

      - name: Run SpotBugs
        if: always()
        run: ./gradlew spotbugsMain -PstaticAnalysis=true

      - name: Upload Static Analysis Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            build/reports/checkstyle/
            build/reports/spotbugs/
          if-no-files-found: warn
