
name: CI quality checks

# This starter already runs on StaticAnalysis. Push it first and inspect the
# successful Build job before completing the remaining TODOs.
on:
  workflow_dispatch:
  push:
    branches:
      - StaticAnalysis
      - Dev
  pull_request:
    branches:
      - StaticAnalysis
      - Dev

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile and assemble
        run: ./gradlew assemble

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      # TODO 2: Checkout, Java setup, and Gradle permission.
      - name: Add the checkout
        uses: actions/checkout@v6

      - name: Java setup
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Gradle permission
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew test

      # TODO 3: Upload test report.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          if-no-files-found: warn

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      # TODO 4: Checkout, Java setup, and Gradle permission.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java setup
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Gradle permission
        run: chmod +x ./gradlew

      # TODO 5: Checkstyle and SpotBugs.
      - name: Run Checkstyle
        run: ./gradlew checkstyleMain

      - name: Run SpotBugs
        if: always()
        run: ./gradlew spotbugsMain -PstaticAnalysis=true

      # TODO 6: Upload static analysis reports.
      - name: Upload Static Analysis Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            build/reports/checkstyle/
            build/reports/spotbugs/
          if-no-files-found: warn
