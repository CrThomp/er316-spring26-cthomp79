gname: Verified application build

on:
  workflow_dispatch:

  # EXTRA CREDIT: Add a temporary schedule here if required.
  # schedule:
    # - cron: '2-59/5 * * * *'

permissions:
  contents: read

concurrency:
  group: verified-application-build
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      # TODO 1: Checkout, Java setup, Gradle permission, and tests.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-test-report
          path: build/reports/tests/
          if-no-files-found: warn

  package:
    name: Package verified application
    # TODO 2: Wait for tests to succeed.
    needs: test
    runs-on: ubuntu-latest
    steps:
      # TODO 3: Set up a fresh runner.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Create distribution ZIP
        run: ./gradlew distZip

      # TODO 4: Upload the distribution ZIP.
      - name: Upload application distribution
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: verified-application-distribution
          path: build/distributions/*.zip
          if-no-files-found: error
